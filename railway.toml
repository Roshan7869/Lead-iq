[build]
builder = "NIXPACKS"

[deploy]
startCommand = "/app/.venv/bin/uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health/live"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[service]
name = "leadiq-backend"
numReplicas = 1
ephemeralStorage = "1GB"
