[phases.setup]
nixPkgs = ["python312", "python312Packages.pip", "python312Packages.setuptools"]

[phases.install]
commands = [
  "cd backend && pip install -r requirements.txt --no-cache-dir",
  "pip install scrapling[fetchers] --no-cache-dir",
]

[start]
cmd = "cd backend && uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
