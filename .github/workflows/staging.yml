name: staging-deploy

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "npm" }

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Unit Tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL }}
          NEXT_PUBLIC_ENV: staging

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v5
      - name: Sync deps
        run: uv sync --project backend --extra dev
      - name: Unit tests
        run: uv run --project backend pytest backend/tests -q
      - name: Integration tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: uv run --project backend pytest backend/tests -q -m integration

  deploy-preview:
    needs: [lint-and-test, backend-tests]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --token=$VERCEL_TOKEN --env NEXT_PUBLIC_API_URL=${{ secrets.STAGING_API_URL }}
